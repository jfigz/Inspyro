name: Feature request
description: Suggest a product, workflow, or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Agents / MCP workflow
        - Notebook authoring
        - Report generation
        - Example workspaces
        - Desktop shell
        - Documentation
        - Developer experience
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or limitation is getting in the way?
      placeholder: Describe the user problem first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should Inspyro do differently?
      placeholder: Describe the capability, flow, or improvement you want.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Who benefits, and what becomes easier or faster?
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Links, screenshots, examples, or related workflows.
