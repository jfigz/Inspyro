maintenance_rules:

  - "Si cambia un mensaje WS en backend/main.py, actualizar contracts-catalog.md + llm-index.yaml + modulos backend/frontend impactados."

  - "Si cambia un flujo E2E, actualizar feature-threads.md + synergy-matrix.md."

  - "Si cambia ownership de estado/concurrencia, actualizar system-context.md y módulos impactados."

  - "Los tests de diagnostico/manual deben marcarse con `manual`/`integration`/`windows_com` para evitar side-effects en coleccion pytest."

  - "Mantener fechas de 'Última actualización' en formato YYYY-MM-DD."

  - "Toda documentación bajo docs/ y AGENTS.md debe estar en UTF-8 con BOM."

  - "Si cambia el dispatcher WS, ejecutar `.\\agent_debug.ps1 contracts-check` y corregir drift antes de commit."

  - "Para iteración de agente usar `.\\agent_debug.ps1 verify-fast`; para pre-merge usar `.\\agent_debug.ps1 verify`."

  - "Regenerar `frontend/src/contracts/wsMessageTypes.generated.js` con `npm run generate:ws-types` cuando cambie llm-index o contratos WS."

  - "Ejecutar .\\agent_debug.ps1 docs-check al cerrar cambios de documentación."

  - "Si cambias shell desktop o empaquetado same-origin, actualizar `docs/modules/24-desktop-shell.md` + `docs/architecture/frontend-flow.md` + `docs/architecture/system-context.md` + `docs/architecture/feature-threads.md`."

  - "Si cambias backend/mcp_server o la conectividad MCP, ejecutar .\\agent_debug.ps1 mcp-smoke con backend+MCP activos."

  - "Si cambias binding JSON de templates por notebook, Home legacy de templates o las tools MCP de template, ejecutar .\\agent_debug.ps1 template-binding-bank y revisar `output/template-binding-bank/<run-id>/summary.json`."

  - "Si cambias `backend/dev/mcp_torture_probe.py`, `backend/dev/mcp_torture_assets.py` o la fixture `backend/dev/fixtures/mcp_torture_template.docx`, ejecutar .\\agent_debug.ps1 mcp-torture y revisar `report.json`/`report.md` del workspace generado."

  - "Si cambias `backend/mcp_server/resources/`, `backend/mcp_server/prompts/` o `mcp.instructions`, mantener sincronizados perfiles/nombres públicos del MCP (`authoring` por defecto, `analysis/files/admin` opt-in), actualizar `docs/modules/19-mcp-server.md` + `docs/changelog/19-mcp-server.md` + `docs/architecture/feature-threads.md` y validar `backend/tests/test_mcp_ai_first.py`."

  - "Para benchmark reproducible de carga WS usar `.\\agent_debug.ps1 stress-ws` o `backend/scripts/stress_ws_mix.py`."

  - "Para publicar releases públicos, seguir `docs/release/public-publication-protocol.md` y usar `tools/release/public_release.ps1`; no empujar P1/P2 desde ese flujo."
