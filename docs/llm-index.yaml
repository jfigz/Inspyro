      "tools/repair_docx_provenance.py"

    ]

    upstream: ["04", "17"]

    downstream: ["04", "09", "14"]

    contracts_in: ["notebook_execute_cell", "force_reconvert_pdf", "template_preview_style"]

    contracts_out: ["notebook_cell_executed", "notebook_docx_update", "notebook_pdf_ready", "pdf_reconverted"]

    state_owner: "docx session relationship-aware + dual math pipeline (`math_latex()` recomendado via latex2mathml vendorizado + MathML -> OMML, `math()` legacy intacto) + normalización MathML previa al XSL para delimitadores extensibles en matrices/cases y fences `\\left...\\right` soportados (`() [] {} | ‖ ⟨⟩`) con emparejamiento anidado y contenido agrupado como único operando OMML + reparación OMML post-transform para operandos vacíos de n-arios (`\\sum`/`\\prod`/`\\int`) dentro de fences complejos, evitando placeholders en Word + template table runtime defaults + builder_required_style_defaults/font metadata reutilizados desde template.json + plantillas runtime Word-first que conservan estilos/header/footer/sectPr pero limpian el body antes de insertar contenido generado + helpers `math_to_docx` resueltos contra el namespace llamador del notebook + rebuild defensivo que conserva el cuerpo actual si no puede restaurar bloques con contenido + fallback seguro de estilos paragraph requeridos + counters/bookmarks de captions `SEQ` para Figura/Tabla + repair export-time de `headerReference/footerReference` desde template cuando notebooks pierden `sectPr` estructurales + provenance per-fragment con destinos `callsite + exact`, `user_stack`, filtros para no promocionar `ipykernel_*` como `callsite` util y hyperlinks estables `/api/docx/provenance/open` construidos contra el backend runtime + split explícito raw vs delivery (`export_docx_base64()`/`serialize_docx_bytes()` internos para PDF-reconvert y `doc_export(...)` delivery saneado) + handoff notebook->backend file-backed por ejecución con fallback legacy stdout + sanitización de entrega sobre OOXML completo para que todo DOCX Word-visible elimine hyperlinks automáticos y field codes `HYPERLINK` de procedencia mientras el artifact interno conserva la copia link-first para PDF/reconversión + `builder.document` proxy rastreado para `python-docx`/OOXML y `builder.document_raw` como escape hatch + persistent DOCX artifact store/history/manifests (30 dias) + metadata de copia persistida `workspace_path/workspace_relpath/workspace_warning/workspace_root` resuelta primero desde `source_path` + dedupe visible por `execution_id + binary_hash` en `Docx_Documents` + clasificacion `docx_is_empty`/`docx_warning` + latest non-empty lookup + pdf cache + automatización Microsoft Word aislada por subproceso `DispatchEx`/PID propio con fallback LibreOffice si la instancia no es verificable + cola async explícita del convertidor PDF Word-capable con executors dedicados y `pdf_queue_wait_ms` para que notebooks paralelos no bloqueen el pool compartido mientras esperan turno del recurso externo + cache visual persistente `docx_render_cache.py` por `binary_hash + renderer_signature + profile`, PDF canónico y PNGs PyMuPDF por página/zoom con manifiesto, `pages_dir`/`local_path` validados, resource handles y limpieza de derivados + entrega WS notebook-first link-first aun para artefactos pequeños cuando ya existe `docx_ref` / `pdf_ref` estable, reduciendo contención entre notebooks paralelos sobre el mismo websocket + `docx_core` OOXML compartido para Workbench + auditoría por perfiles/operaciones Workbench con summaries/resources/variantes inmutables + builder helpers de entrega (`alt_text`, header rows repetibles, anchos/padding/alineación, `doc_finalize(profile)` exportado por `docx_builder`/`math_to_docx`) + utilidad `tools/repair_docx_provenance.py` para limpiar DOCX ya descargados con el mismo sanitizer productivo"

