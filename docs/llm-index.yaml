flows:

  - name: "notebook_execute_and_export"

    modules_involved: ["14", "11", "04", "09", "01"]

    steps:

        - "Frontend envia notebook_execute_cell con execution_id opcional, `cell_type` aditivo (`code|docx`) y presupuesto efectivo `execution_timeout_s=600`; la UI solo mantiene una gracia corta local para el terminal WS"

      - "Frontend conserva una sesion notebook por tab/path; ir a Home, cambiar de tab u abrir otro archivo no cancela el kernel vivo, el shell sigue absorbiendo `notebook_*` aunque el editor se desmonte y la navegación normal reutiliza `initialKernelId` sin mandar attach automático; al rehidratar el notebook activo, `App.js` solo adopta `notebookData` cuyo `notebookSyncState.path` coincide con la sesión visible"

      - "Dispatcher prioriza control (interrupt/reset/shutdown/cancel) y encola trabajo por conexion"

      - "Backend instrumenta y ejecuta en kernel; `INSPYRO_LOCK_TIMEOUT` acota solo la adquisicion del lock por kernel, mientras `execution_timeout_s` (o `INSPYRO_NOTEBOOK_EXECUTION_TIMEOUT=600`) gobierna la ejecucion real; en batch la semantica efectiva es `skip_pdf=true` salvo en la ultima celda ejecutable y el postproceso DOCX/PDF usa `INSPYRO_NOTEBOOK_PDF_TIMEOUT=600`"

      - "Se emiten streams/clear_output/update_display_data/comm_* en tiempo real con callbacks desacoplados, backlog acotado y execution_id aditivo; si `execute_reply` vence, el kernel manager cancela los readers IOPub pendientes para no dejar la sesion degradada, y lecturas benignas `Empty` se tratan como espera del canal en vez de error duro"

      - "La captura runtime evita `repr()` inseguro sobre objetos COM/interop y, si degrada, `notebook_cell_executed` puede incluir `variables_snapshot_degraded` + `execution_diagnostics` sin bloquear el cierre terminal ni esperar rescates documentales inline"

        - "La exportacion DOCX final corre despues del terminal; celdas nuevas de informe se exponen como tipo lógico `docx` y se persisten con `metadata.inspyro.cell_kind=docx`, la deteccion por API DOCX queda como compatibilidad legacy AST/token-aware para evitar falsos positivos como `pd.DataFrame(...)`, los adaptadores MCP calculan `emit_docx` por celda exportable y atan `skip_pdf` a la ultima celda documental, `doc_finalize()` esta disponible en el namespace publico/preámbulo, y la instrumentacion notebook compila el source con filename sintetico `<inspyro-notebook:{cell_id}>` mientras envuelve `build_doc`/`doc_block`/`doc_begin` para propagar `notebook_cell_id`"

        - "DOCX/PDF OFF en UI o `include_docx=false` en MCP omite celdas `docx` para iteracion de calculo; no se envia `notebook_mdoc_clear` ni se invalida el ultimo DOCX/PDF visible"

      - "Cuando la celda usa captions DOCX (`figure`, `image`, `table`, `dataframe`, `caption(number=True)`), `docx_builder` emite campos Word `SEQ` para Figura/Tabla y bookmarks sobre el número efectivo para que `reference(label)` resuelva a la numeración del objeto"

      - "Durante batch (`skip_pdf=true`) las celdas intermedias no persisten artefactos DOCX ni agregan historial; solo la ultima celda exportable puede fijar el DOCX final del lote"

      - "Cada generacion DOCX final persiste un artifacto estable (`artifact_id`) con metadatos de `source_path`/`kernel_id`/`execution_id`; si el binario coincide con uno previo se reutiliza el blob por hash, pero se conserva una entrada historica nueva"

      - "El Workbench DOCX se ejecuta bajo demanda sobre `artifact_id`/`source_path`/`kernel_id`: `source_path` identifica el origen con historial DOCX de Inspyro, no una copia `.docx` exportada; backend cachea `quality_summary.json` por `artifact_id + binary_hash`, persiste summaries/resources/variantes, puede renderizar paginas PNG con PyMuPDF, gestionar comments/redlines/fields/SDTs/diff y generar copias limpias/publicables sin mutar el DOCX original"

      - "Los handles de recursos Workbench/render son link-first y se validan como segmentos seguros antes de resolver rutas; los manifests pueden exponer `pages_dir`/`local_path` validados para depuracion local, pero `resource_uri` sigue siendo el contrato principal y el backend rechaza IDs traversal o rutas fuera del store/cache antes de leer bytes"

      - "La sesión DOCX captura procedencia por fragmento visible con destinos `callsite + exact`, `user_stack`, persiste un manifiesto por `artifact_id`, rastrea `python-docx`/OOXML via `builder.document` y embebe hyperlinks `/api/docx/provenance/open?provenance_id=...` sobre el contenido visible trazable; toda salida Word-visible (`doc_export`, payload WS, token y `/api/docx/download`) sanea luego esos hyperlinks automáticos y field codes `HYPERLINK`, pero el artifact interno sigue siendo link-first para PDF/reconversión"

      - "Si el DOCX exportado queda sin body util (`word/document.xml` solo con `sectPr`), backend responde `docx_is_empty=true`, agrega warning y no reemplaza el ultimo documento valido ni persiste un artefacto nuevo para esa ejecucion"

      - "docx_builder serializa snapshots con metadata de relaciones OOXML/medios; al rebuild rehidrata `rId`s y valida referencias internas (`a:blip`, `r:id`) antes de persistir o convertir el paquete"

      - "Las celdas largas pueden emitir `notebook_progress_update` pre-terminal (`progress_scope=execution`, `progress_stage=cell_run`, `progress_indeterminate=true`) para refrescar liveness UI sin cambiar el rol terminal de `notebook_cell_executed`"

      - "La UI notebook usa un rail superior secuencial: verde para la corrida de celdas y rojo para el pipeline documental (`queued` -> `docx_export` -> `docx_ready` -> `pdf_convert`) sin solapar ambas fases"

      - "La ultima celda exportable cierra primero con `notebook_cell_executed`, sin pedir `capture_docx` ni `__INSP_NOTEBOOK_DOCX` en el reply terminal, y deja la exportacion DOCX/PDF completamente en background; un coordinador latest-wins por `kernel_id` invalida emisiones documentales stale y el documento final llega despues por `notebook_progress_update`/`notebook_docx_update`/`notebook_pdf_ready` con el mismo `execution_id`. En UI humana ese flujo viaja por `/ws/notebook`, y la copia visible en `Docx_Documents` se resuelve desde `source_path` antes de degradar al workspace activo"

      - "Cuando el pipeline documental espera o usa el convertidor PDF global, backend publica `shared_resource={ kind: \"pdf_converter\", scope: \"global\", status: \"waiting\"|\"running\" }` en `notebook_progress_update`; `home-summary` refleja ese mismo progreso notebook-scoped para notebooks ocultos y lo limpia solo en terminales documentales reales, no en `notebook_docx_update` intermedios"

      - "Artefactos grandes usan referencias aditivas (`docx_ref`/`pdf_ref`) para evitar base64 masivo por WS; el DOCX reemite siempre una ruta estable aunque el hash semantico no cambie y, si falla el storage persistente/legacy, el backend conserva un fallback descargable por `kernel_id`"

      - "Frontend resuelve DOCX por `docx_ref`, `docx_artifact_id`, `docx_file_token` o lookup estable por `source_path`; `DocxViewer` descarga por `fetch -> blob`, reintenta contra la ruta estable si una ref temporal expira, recibe DOCX visibles sin hyperlinks automáticos ni field codes `HYPERLINK` de procedencia y consulta `docx_provenance_ref` cuando hay preview PDF para usar `Modo origen` sobre un visor `pdfjs-dist` controlado que resuelve `numPages`, outline real, destinos internos, `requestedPage` y render windowed/lazy sin contratos backend nuevos; el click de procedencia prioriza `exact`, puede reresolver `provenance_id` puntuales con `/api/docx/provenance/open?format=json`, reescribe hyperlinks absolutos stale al `API_BASE` activo, puede derivar `provenance_id` desde el propio URL si el overlay no lo trae y, si el destino es una celda sin `file_path`, degrada a `source_path` del documento para abrir la `.ipynb` correcta antes de navegar. La carga del PDF se gobierna por la fuente real del documento y no por la identidad de callbacks del shell, y el teardown drena la generación activa antes de destruir `pdf.js`"

      - "DocxViewer expone `Workbench DOCX` como rail derecho bajo demanda con badge `OK`/`Avisos`/`Revisar`, tabs de Calidad/Visual/Revision/Publicacion/Campos/Diff y acciones explícitas contra `/api/docx/workbench/run`; prioriza `docx_render_*` para estado visual y solo notifica exito de render cuando Workbench devuelve resultado valido; el historial DOCX y Home muestran badges derivados de `docx_quality_*` sin correr auditoria pesada al montar"

      - "Las entradas historicas `docx_is_empty=true` siguen visibles con warning, pero el lookup latest backend y el boton principal `DOCX` del frontend las saltan en favor del ultimo artefacto no vacio"

      - "El historial local frontend solo registra un DOCX nuevo cuando existe identidad estable real (`docx_artifact_id`, `docx_ref`/`docx_download_url`, `docx_file_token`) o base64 inline efectivo; payloads DOCX nulos/stale no deben inflar el contador"

      - "Frontend puede cancelar con notebook_cancel_execution"

    failure_points: ["lock timeout", "kernel hang", "pdf conversion unavailable", "control plane starvation si falla priorizacion", "runtime snapshot degraded on COM/interop objects", "refs DOCX stale/expiradas si se rompe el lifecycle del artifact store"]

  - name: "template_edit_preview_apply"

    modules_involved: ["14", "17", "04", "09", "01"]

    steps:

      - "Frontend sube plantilla por REST (`POST /api/templates/upload`) y adjunta por WS (`template_attach`); `template_upload` queda como fallback legacy solo ante fallo de transporte/no disponibilidad del upload REST. `App.js` centraliza el attach one-shot: upload/import solo generan `template_token`, `template_attach` se emite por `/ws/notebook` de la libreta activa para que el ACK vuelva por la misma cola del editor, y `lastTemplateAttach` queda `pending` hasta ACK `template_uploaded`/`template_info`. El export portable usa `GET /api/templates/export` y la importación JSON vuelve a reutilizar upload + attach sin WS nuevos. El binding canónico usa `POST /api/templates/bind`: escribe `<notebook_stem>.inspyro-template.json`, parchea `metadata.inspyro.template_binding`, autoaplica al cargar kernel y autoexporta tras ACKs `template_*`. Desde Home, `App.js` prefiere ese JSON; si solo hay mirror legacy, abre primero la `.ipynb` origen y tokeniza el mirror `.docx` para migración/attach, sin pasarlo por el lector binario de archivos"

      - "Para estilos de tabla, frontend versiona `preview_key` con `table_signature`"

      - "Mutaciones (`upload/update/delete/create/apply`) usan `request_id` opcional para correlación determinística de ack/error"

      - "Frontend envía updates de tabla en formato dual (`table_*` + bloque `updates.table`) y backend normaliza"

      - "Frontend edita Word-complete con controles estructurados por familia y puede enviar payloads aditivos (`word_style`, `word_defaults`, `style_visibility`) sin romper claves planas legacy; backend normaliza metadata, visibilidad, fuente/run, párrafo (`tabs`, `pBdr`, `shd`), listas, tablas y raw/advanced_props validado hacia OOXML seguro"

      - "El rail de preview principal ya no renderiza estilo-a-estilo: frontend construye un DOCX de ejemplo completo con header/footer, titulos, texto, captions, codigo, listas, tabla con estilo y tabla directa; lo renderiza con `docx-preview`, hace foco por seccion activa y limpia cualquier pagina Word stale al cambiar seleccion/template"

      - "Render manual Word nativo usa `POST /api/templates/sample-preview/render-word` con el mismo DOCX base64 y `preview_key`; `template_preview_style` con `force_refresh=true` queda como compatibilidad legacy para clientes no migrados"

      - "Backend procesa preview en background con latest-wins y cancelación (`template_preview_cancel`); frontend también cancela previews activas en timeout, cierre y cambio de pestaña"

      - "Cambios de estilo se aplican con módulos especializados (`template_style_apply`, `template_extract`, `template_preview`) manteniendo compatibilidad en `template_service`"

      - "Para estilos de tabla, `template_service` persiste solo OOXML-safe en `styles.xml`, mueve `tblLook/tblLayout/tblW` a `table_style_runtime_defaults`, sanea plantillas legacy con backup en primer uso, repara declaraciones `xmlns:*` faltantes cuando `mc:Ignorable` queda inconsistente en cualquier parte OOXML y escribe parts DOCX mediante ZIP temporal validado + replace atómico"

      - "Cuando una tabla de muestra usa `tblStyle`, `template_apply_table_format` resuelve ese estilo Word fuente y mezcla sus propiedades efectivas con overrides directos; si la tabla no trae bordes/sombreado/márgenes directos, conserva el estilo destino y el frontend ofrece asignar el estilo fuente al slot `table_default`"

      - "Kernel recarga template + `semantic_style_slots` + `table_style_runtime_defaults` + `builder_required_style_defaults`; `docx_builder` reaplica `look/layout/width` sobre cada tabla concreta, hereda `docDefaults` globales materializados desde `styles.xml`, limpia el body del `.docx` base preservando header/footer/sectPr, preserva `semantic_style_slots` por `style_id` después de reextracciones de estilo/defaults y deriva fuentes fallback desde la metadata efectiva del template en vez de volver a `Calibri/Consolas` ciegamente"

      - "La extracción del template suma `document_captions`, mantiene `style_coverage` como resumen requerido y añade `word_capabilities` + `style_browser` con categorías detectadas, conteos, `auto_selected`, estilos ocultos/latentes, `style_visibility` y `word_style`, permitiendo al editor navegar todos los estilos sin cambiar contratos WS"

      - "La extracción del template publica `content_controls` reutilizando la inspeccion OOXML nativa: el sidebar `Campos` lista SDTs y advierte placeholders `{{TAG}}` no envueltos sin crear una ruta paralela de autoría"

      - "Frontend sincroniza `templateInfo`, conserva el draft local hasta el ack correlado de `template_style_updated`, `template_document_defaults_updated`, `template_semantic_slots_updated`, `template_style_created` o `template_format_applied`, rehidrata desde el `template` autoritativo devuelto por backend, usa `resolved_font`/`font_source` como fuente efectiva única para cards/panel/preview, navega por estilos detectados con `selection_key` estable, filtra ocultos por defecto con toggle `Mostrar ocultos` y persiste `semantic_style_slots` como contrato Word-first del runtime; `templateInfo`/`templateBlob`/`templateOpenRequest` quedan particionados por notebook en `App.js`, y `category_overrides` queda solo como compatibilidad de import legacy"

      - "Si una preview de tabla falla o expira, el frontend limpia el estado interno de solicitud y permite retry explícito sin recargar la plantilla"

      - "El banco exhaustivo del Template Editor genera fixtures DOCX sintéticas, prueba backend roundtrip/sanitización, ejecuta E2E de upload+attach con dedupe, edición rápida/Word-complete, export/import portable, cierre/reapertura y generación DOCX desde notebook, y registra `summary.json`/`summary.md` con artefactos, auditoría OOXML y Workbench/render visual cuando está disponible"

    failure_points: ["preview queue saturation", "stale preview cache", "contention with notebook execution", "invalid table_index rejected", "table preview look mismatch if tblLook not aligned", "serializacion invalida de propiedades runtime de tabla en styles.xml", "feedback visual insuficiente durante latencia de render", "upload > 20MB bloqueado en frontend", "errores REST funcionales ocultados por fallback WS", "cancelacion tardia de preview en cargas extremas", "colisiones por nombres duplicados si se pierde `selection_key` o si los `semantic_style_slots` quedan stale tras reextraer la plantilla", "falso lector binario si Home abre el mirror `.docx` como archivo en vez de resolver la `.ipynb` origen", "`template_attach` perdido o ACK invisible si se emite por una cola WS distinta a la que consume el editor activo", "JSON stale si una recuperacion de DOCX corrupto no reextrae metadata desde el binario regenerado", "banco exhaustivo verde sin validar DOCX generado, auditoría OOXML o render visual no vacío"]

  - name: "dependency_analysis_runtime_enriched"

    modules_involved: ["14", "13", "11", "12", "06", "09", "03"]

