    contracts_out: ["notebook_*", "notebook_execution_cancelled", "template_*", "template_preview_cancelled", "execution_*", "pdf_reconverted"]

    state_owner: "kernel orchestration + notebook runtime state + tipo lógico `docx` persistido como `cell_type=code` + `metadata.inspyro.cell_kind=docx` con validación nbformat + binding persistible `metadata.inspyro.template_binding` hacia JSON portable relativo al notebook con autoapply no bloqueante en load/create/reset y autoexport tras ACKs template + migración suave de notebooks legacy `cell_type=docx`/fuentes DOCX mediante detector AST/token-aware que evita falsos positivos como `pd.DataFrame(...)` + snapshots notebook por `kernel_id` para reattach (`notebook_attach_kernel`) + mapping reconnect-safe `kernel_id -> websocket` con rebind en requests notebook/template/control válidas y cleanup diferido cancelable del socket previo + attach/upload de template reinyecta `semantic_style_slots` junto con `template_path`, `table_style_runtime_defaults` y `builder_required_style_defaults` + provenance DOCX por kernel (`kernel_id -> source_path/source_kind`) + ownership DOCX por `notebook_cell_id` para cleanup de bloques stale + `doc_finalize()` exportado e inyectado por el preámbulo notebook/builtins + instrumentación compile/exec con filename sintético `<inspyro-notebook:{cell_id}>` para líneas exactas de procedencia + `notebook_loaded` rellena `cells[].id`/`metadata.inspyro_id` cuando el payload legacy carece de ids + heartbeat WS por `execution_id` para celdas largas sin terminal inmediato + metadata de ruteo temprana (`kernel_id`/`source_path`/`source_kind`) en forward IOPub y keepalive de progreso + evidencia compacta de recovery post-disconnect por `execution_id` (terminal observado o artefacto exacto) + progreso WS estructurado por scope/stage para separar corrida de celdas del pipeline DOCX/PDF tardío + `notebook_progress_update.shared_resource` aditivo para recursos serializados reales (`pdf_converter` global `waiting|running`) + exportación documental final siempre diferida después del terminal + coordinador documental latest-wins por `kernel_id` con ventana corta de estabilización + cola explícita del convertidor PDF notebook-first mediante `build_pdf_context_async()` para sacar la espera de Word del executor compartido + runtime registry notebook/code visible en Home + `home_compact_store` mantiene `progress/shared_resource` hasta terminales documentales reales, no hasta `notebook_docx_update` intermedio + handoff DOCX/provenance file-backed por ejecución con fallback stdout + timings documentales extendidos (`kernel_export_ms`, `transport_read_ms`, `workspace_write_ms`, `pdf_queue_wait_ms`, etc.) + la ejecución terminal ya no depende de `capture_docx`/`__INSP_NOTEBOOK_DOCX` en el reply"

