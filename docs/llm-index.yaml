    contracts_out: ["notebook_execute_cell", "notebook_cancel_execution", "notebook_shutdown_kernel", "analyze_dependencies", "analyze_impact"]

    state_owner: "notebook state visible en browser + superficie activa del notebook + helpers centralizados para `code|markdown|docx`, activador visual `code <-> docx`, renderer Markdown enriquecido frontend-local (`marked` + `marked-katex-extension` + `marked-footnote` + `mermaid`) con `HTML/JS confiable` como gate explícito de scripts, bloqueo de celdas DOCX cuando DOCX/PDF está OFF y omisión en Run All sin emitir `notebook_mdoc_clear` + consumo de mensajes notebook ya ruteados por `App.js` mediante `consumeRemoteNotebookMessage()` + metadata DOCX por notebook/archivo para descargas e historial + propagación de `docx_provenance_available`/`docx_provenance_ref` hacia el shell incluso desde `notebook_pdf_ready` tardío + hidratación runtime clasificada por origen (`runtime` vs `persistable`) y por token explícito de rehidratación para evitar DIRTY falso o remounts por cada stream + `initialKernelId` tratado como runtime vivo, `lastMessage` degradado a fallback shell-compatible y reuso de sesión local sin shutdown automático al navegar + `notebook_attach_kernel` reservado a recovery explícito/reconexión en vez de navegación normal + fallback ids estables via `metadata.inspyro_id` cuando faltan `cell.id` + watchdog local por `execution_id` alineado a `execution_timeout_s=600` con gracia corta para no cancelar `Run All` si llegan keepalives pre-terminal o si el rescate documental llega tarde + rail superior secuencial (verde ejecución / rojo documento) sin solape + fase verde cerrada exclusivamente por `notebook_cell_executed` + copy documental explícito derivado de `shared_resource` (`Esperando/Usando convertidor PDF compartido`) en vez de texto libre + fallback de navegación notebook best-effort por línea cuando el `cellId` persistido por procedencia ya no existe"

    ui_mode: "result-first: markdown narrativo visible con GFM amplio, KaTeX, footnotes, task lists y Mermaid; celdas `code|docx` colapsadas por defecto; split inicial de notebook mas ancho que el editor de codigo; gutters/padding compactos para maximizar resultados; Monaco bajo accion explicita o navegacion a linea; outputs como superficie de resultado con MIME bundles ricos, placeholders seguros para widgets/JS salvo `HTML/JS confiable`, y reemplazo live por `display_id`"

